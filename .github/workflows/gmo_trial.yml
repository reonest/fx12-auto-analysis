name: GMO-first FX data trial (non-publishing)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'dual_source_trial.py'
      - 'gmo_fx_probe.py'
      - 'test_dual_source_trial.py'
      - '.github/workflows/gmo_trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate selection logic offline
        run: python -m unittest -v test_dual_source_trial.py
      - name: Probe GMO first and Yahoo fallback on 3 FX pairs
        run: python dual_source_trial.py --max-pairs 3
      - name: Reminder
        run: echo "Diagnostic only. No order endpoints, secrets, docs updates or price republication."
